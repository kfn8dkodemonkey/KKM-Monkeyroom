<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="{{ site.description | escape }}">
  <title>{{ site.title | escape }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">K</span> KKM Admin</a>
      <nav aria-label="Main"><a href="#projects">Current projects</a><a href="#tools">Tools &amp; resources</a></nav>
    </div>
  </header>
  <main id="main" class="container py-5" tabindex="-1">{{ content }}</main>
  <footer class="container pb-4"><div class="footer-inner">Kaffeinated Kodemonkey <span>Your personal workspace</span></div></footer>
</body>
</html>
